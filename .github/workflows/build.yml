name: Build BTLEmap

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -project BLE-Scanner.xcodeproj \
            -scheme BLE-Scanner \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Check built app
        run: |
          ls -la build/Build/Products/Debug-iphoneos/
          test -d build/Build/Products/Debug-iphoneos/BTLEmap.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/BTLEmap.app Payload/
          zip -r BTLEmap.ipa Payload

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: BTLEmap-app
          path: build/Build/Products/Debug-iphoneos/BTLEmap.app
          if-no-files-found: error

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BTLEmap-ipa
          path: BTLEmap.ipa
          if-no-files-found: error