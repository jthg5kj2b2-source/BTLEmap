name: Build BTLEmap

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -project BLE-Scanner.xcodeproj \
            -scheme BLE-Scanner \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Check built app
        run: |
          ls -la build/Build/Products/Debug-iphoneos/
          test -d build/Build/Products/Debug-iphoneos/BTLEmap.app

      - name: Package IPA
        run: |
          rm -rf Payload BTLEmap.ipa
          mkdir Payload
          cp -R build/Build/Products/Debug-iphoneos/BTLEmap.app Payload/
          zip -qry BTLEmap.ipa Payload
          echo "=== IPA ==="
          ls -lh BTLEmap.ipa
          echo "=== IPA contents ==="
          unzip -l BTLEmap.ipa | head -30
          echo "=== APP ==="
          ls -la Payload/BTLEmap.app

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: BTLEmap-app
          path: build/Build/Products/Debug-iphoneos/BTLEmap.app
          if-no-files-found: error

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BTLEmap-ipa
          path: BTLEmap.ipa
          if-no-files-found: error